<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Adiabatic Air Expansion Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="kit/iso.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: two 16:9 slides for a big screen. Each board is laid out at 1600 × 900 and scaled to fit
   the window (app.js sets --s), so both pages keep exactly 16:9 and the same look at any size;
   under 1000 px wide they fall back to a scrolling column. Page 1 = header, control rail, chart and
   comparison; page 2 = the plant drawn to scale with labels in bands above and below, and a readout.
   Black background, white lines; hot side warm, cold side blue. */
:root {
  --bg: #eef1f0;
  --board: #fbfcfb;
  --ink: #1b2427;
  --muted: #5d6a6e;
  --rule: #cfd7d6;
  --cold: #1c6fb8;
  --cold-soft: #d6e6f4;
  --hot: #c4501c;
  --hot-soft: #f5dfd3;
  --frontier: #7a4fb5;
  --ac: #6b7378;
  --good: #2b8a3e;
  --warn: #b7791f;
  --bad: #c92a2a;
  --face-top: #f3f5f4;
  --face-x: #d9dfdd;
  --face-y: #bcc6c4;
  --f-display: "Barlow Condensed", "PingFang SC", "Noto Sans SC", "Arial Narrow", sans-serif;
  --f-body: "Source Sans 3", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --board: #000; --ink: #f2f2f2; --muted: #9b9b9b; --rule: #2a2a2a;
    --cold: #5ea8ec; --cold-soft: #17344d; --hot: #ec8350; --hot-soft: #4a2617; --frontier: #b18ce8; --ac: #9aa4a9;
    --good: #69c37a; --warn: #e0a84a; --bad: #f07272;
    --face-top: #2e2e2e; --face-x: #222; --face-y: #181818;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000; --board: #000; --ink: #f2f2f2; --muted: #9b9b9b; --rule: #2a2a2a;
  --cold: #5ea8ec; --cold-soft: #17344d; --hot: #ec8350; --hot-soft: #4a2617; --frontier: #b18ce8; --ac: #9aa4a9;
  --good: #69c37a; --warn: #e0a84a; --bad: #f07272;
  --face-top: #2e2e2e; --face-x: #222; --face-y: #181818;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; max-width: 1400px; margin: 0 auto 12px; }
.top h1 { font: 700 26px/1.1 var(--f-display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.top h1 small { display: block; font: 400 13px/1.3 var(--f-body); color: var(--muted); letter-spacing: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--board); }
.seg button { font: 600 13px var(--f-body); border: 0; background: none; color: var(--ink); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--board); }
.seg button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--cold); outline-offset: 1px; }
.modes button[data-mode="frontier"][aria-pressed="true"] { background: var(--frontier); }
.modes button[data-mode="ideal"][aria-pressed="true"] { background: var(--cold); }

.board { margin: 0 auto 20px; background: var(--board); border: 1px solid var(--rule); border-radius: 4px; position: relative; display: flex; flex-direction: column; }
.board > .tag { position: absolute; bottom: 8px; right: 14px; z-index: 2; font: 600 11px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.board > .top { margin: 0; padding: 12px 18px; border-bottom: 1px solid var(--rule); max-width: none; }
.board > .p1, .board > .p2 { flex: 1; min-height: 0; }
@media (min-width: 1000px) {
  .slide { width: var(--sw, 1600px); height: calc(var(--sw, 1600px) * 9 / 16); margin: 0 auto 24px; overflow: hidden; }
  .slide > .board { width: 1600px; height: 900px; margin: 0; transform: scale(var(--s, 1)); transform-origin: 0 0; }
  body { padding-block: 12px; }
}

/* page 1 */
.p1 { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }
@media (max-width: 999px) { .p1 { grid-template-columns: 1fr; } }
.rail { border-right: 1px solid var(--rule); overflow-y: auto; padding: 14px 14px 20px; min-height: 0; }
@media (max-width: 999px) { .rail { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 60vh; } }
.rail h3 { font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.rail h3:first-child { margin-top: 0; }
.ctl { display: grid; gap: 3px; padding: 6px 0; border-bottom: 1px dashed var(--rule); }
.ctl .lab { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; cursor: pointer; }
.ctl .lab span:first-child { font-weight: 600; font-size: 13px; }
.ctl .val { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.sourced, .dot.fixed { background: var(--good); }
.dot.pending { background: var(--warn); }
.dot.placeholder { background: var(--ac); }
.src { font-size: 12px; color: var(--muted); }
.flag { font: 600 11px var(--f-mono); color: var(--frontier); }
.ctl input[type="range"] { width: 100%; accent-color: var(--cold); }
.ctl input[type="number"], .ctl select { font: 13px var(--f-mono); padding: 3px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--board); color: var(--ink); width: 100%; }
.ctl .seg button { padding: 4px 8px; font-size: 12px; }
.stepper { display: flex; gap: 4px; flex-wrap: wrap; }
.stepper button { font: 12px var(--f-mono); min-width: 32px; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--board); color: var(--ink); cursor: pointer; }
.stepper button[aria-pressed="true"] { background: var(--ink); color: var(--board); }
details.drawer { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 8px; }
details.drawer > summary { cursor: pointer; font: 600 14px var(--f-body); color: var(--ink); }
.rail .modes { display: flex; } .rail .modes button { flex: 1; padding: 6px 4px; }
details.adv > summary { cursor: pointer; font: 600 13px var(--f-body); color: var(--muted); margin-top: 10px; }
.legend-key { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }

.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; padding: 14px 18px 14px; gap: 10px; }
.cmp[hidden], .ctl[hidden], .hint[hidden] { display: none; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: flex-end; }
.kpi .k { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .v small { font: 400 13px var(--f-body); color: var(--muted); margin-left: 3px; }
.kpi.cop .v { color: var(--cold); font-size: 40px; }
.warns { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 600 11px var(--f-body); padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--muted); }
.chart { min-height: 260px; position: relative; overflow-x: auto; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.chart text { font: 11px var(--f-mono); fill: var(--muted); }
.chart .axis { stroke: var(--muted); stroke-width: 1; }
.chart .grid { stroke: var(--rule); stroke-width: .7; }
.chart .c-carnot { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; }
.chart .c-ideal { stroke: var(--cold); stroke-width: 1.6; fill: none; opacity: .55; }
.chart .c-frontier { stroke: var(--frontier); stroke-width: 1.6; fill: none; }
.chart .c-current { stroke: var(--ink); stroke-width: 2.4; fill: none; }
.chart .c-ac { stroke: var(--hot); stroke-width: 1.4; fill: none; }
.chart .c-acnet { stroke: var(--hot); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.chart .cur { stroke: var(--cold); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .opt { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
.chart .now { fill: var(--cold); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.chart .lbl-hot { fill: var(--hot); }
.chart .lbl-front { fill: var(--frontier); }
.chart .lbl-cold { fill: var(--cold); }
.cmp { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 700px) { .cmp { grid-template-columns: 1fr; } }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 12px; }
.bars .h { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); grid-column: 1 / -1; margin-top: 4px; }
.bar { height: 10px; border-radius: 2px; background: var(--rule); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ac); }
.bar.air i { background: var(--cold); }
.bars .n { font: 12px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.note { font-size: 12.5px; color: var(--muted); max-width: 62ch; }
.note b { color: var(--ink); }

/* page 2 */
.p2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100%; }
@media (max-width: 999px) { .p2 { grid-template-columns: 1fr; } }
.stage { position: relative; min-height: 0; display: flex; align-items: center; padding: 8px 10px; }
.stage .plant { position: relative; width: 100%; --anatomy-card: var(--board); --anatomy-paper: var(--board); transition: opacity .2s; }
/* white lines on black */
.stage .plant[data-theme="dark"] { --anatomy-hi: #ffffff; --anatomy-mid: #cfcfcf; --anatomy-lo: #7c7c7c; --anatomy-faint: #2c2c2c; --anatomy-face: #050505; --anatomy-top: #0a0a0a; --anatomy-shade-0: #000; --anatomy-shade-1: #030303; --anatomy-shade-2: #060606; --anatomy-shade-3: #090909; --anatomy-halo: #000; }
.stage.busy .plant { opacity: .55; }
.stage.busy::after { content: attr(data-busy); position: absolute; top: 12px; right: 14px; font: 600 11px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.plant .fig { position: relative; width: 100%; aspect-ratio: 1200 / 640; }
.plant .fig > svg { width: 100%; height: 100%; display: block; }
/* numbered markers on the parts, named in a legend under the drawing: no lines across it */
.plant .marks { position: absolute; inset: 0; pointer-events: none; }
.plant .marks svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plant .marks line { stroke: var(--ink); stroke-width: .8; }
.plant .marks circle { fill: var(--ink); }
.plant .mk { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--f-mono); color: var(--ink); background: var(--board); border: 1.4px solid var(--ink); pointer-events: auto; cursor: default; transition: background .15s, color .15s; }
.plant .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 18px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.plant .lg { display: grid; grid-template-columns: 20px 1fr; column-gap: 8px; align-items: center; font: 600 13px/1.25 var(--f-body); color: var(--ink); cursor: default; }
.plant .lg i { grid-row: span 2; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--f-mono); font-style: normal; border: 1.4px solid var(--ink); }
.plant .lg span { font: 11px/1.25 var(--f-mono); color: var(--muted); }
.plant .onfig { position: absolute; font: 600 11px/1.3 var(--f-mono); color: var(--muted); max-width: 26ch; text-align: center; pointer-events: none; }
.plant .marks line.note { stroke: var(--muted); stroke-width: 1; color: var(--muted); }
.plant .hl.mk, .plant .hl i { background: var(--cold); border-color: var(--cold); color: #000; }
.plant .hl b { color: var(--cold); }
@media (max-width: 700px) { .plant .mk { width: 15px; height: 15px; font-size: 8.5px; } .plant .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } .plant .lg { font-size: 11px; } }
.readout { border-left: 1px solid var(--rule); padding: 14px; overflow-y: auto; min-height: 0; font-size: 12.5px; }
@media (max-width: 999px) { .readout { border-left: 0; border-top: 1px solid var(--rule); } }
.readout h3 { font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
.readout h3:first-child { margin-top: 0; }
.readout table { width: 100%; border-collapse: collapse; font: 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.readout td { padding: 2px 0; border-bottom: 1px dotted var(--rule); }
.readout td:last-child { text-align: right; }
.readout .hot { color: var(--hot); } .readout .cold { color: var(--cold); }
.readout .how { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.readout table.en td:last-child { vertical-align: top; }
.disclaim { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
/* page 3: energy ledger */
.p3 { display: grid; grid-template-columns: 520px minmax(0, 1fr); height: 100%; }
@media (max-width: 999px) { .p3 { grid-template-columns: 1fr; } }
.ledger { border-right: 1px solid var(--rule); padding: 14px 16px 30px; overflow-y: auto; min-height: 0; font-size: 12.5px; }
@media (max-width: 999px) { .ledger { border-right: 0; border-bottom: 1px solid var(--rule); } }
.ledger h3 { font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.ledger h3:first-child { margin-top: 0; }
.lrow { display: grid; grid-template-columns: 128px minmax(0, 1fr) 64px; gap: 8px; align-items: center; margin: 3px 0; }
.lrow .n { font: 12px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.lrow .bar { height: 12px; background: var(--rule); border-radius: 2px; position: relative; overflow: hidden; }
.lrow .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
.lrow .bar i.hot { background: var(--hot); } .lrow .bar i.cold { background: var(--cold); } .lrow .bar i.ink { background: var(--ac); }
.lrow .bar i.band { background: var(--hot-soft); }
.lsub { color: var(--muted); font-size: 11.5px; margin: 0 0 6px 136px; }
.lctl { display: grid; gap: 4px; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.lctl .lab { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; }
.lctl .lab .val { font: 12px var(--f-mono); color: var(--muted); font-weight: 400; }
.lctl input[type="range"] { width: 100%; accent-color: var(--cold); }
.lctl .hint { color: var(--muted); font-size: 11.5px; }
.lbig { display: flex; gap: 22px; align-items: flex-end; margin: 10px 0 4px; }
.lbig .v { font: 700 44px/1 var(--f-display); color: var(--cold); font-variant-numeric: tabular-nums; }
.lbig .k { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ltab { width: 100%; border-collapse: collapse; font-size: 12px; }
.ltab td, .ltab th { padding: 3px 4px; border-bottom: 1px dotted var(--rule); text-align: left; }
.ltab th { font: 600 11px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.ltab td.n { font: 12px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.ltab tr.pick { cursor: pointer; } .ltab tr.pick:hover td { background: var(--cold-soft); }
.ltab tr.off td { color: var(--muted); }
.ltab tr.on td:first-child { box-shadow: inset 3px 0 var(--cold); }
.lchart { position: relative; min-height: 320px; margin: 14px 18px 28px; }
.lchart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lchart text { font: 11px var(--f-mono); fill: var(--muted); }
.lchart .axis { stroke: var(--muted); } .lchart .grid { stroke: var(--rule); stroke-width: .7; }
.lchart .mark { stroke: var(--muted); stroke-dasharray: 3 3; }
.lchart .ac { stroke: var(--ac); stroke-dasharray: 6 4; }
.lchart .ln { fill: none; stroke-width: 2; }
.lchart .cap { fill: none; stroke: var(--muted); stroke-dasharray: 2 3; stroke-width: 1.2; }
.lchart .pt { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
.lchart .title { font: 600 13px var(--f-body); fill: var(--ink); }
/* page 4: why the COP stays low */
.p4 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
@media (max-width: 999px) { .p4 { grid-template-columns: 1fr; } }
.p4 .col { border-right: 1px solid var(--rule); padding: 14px 16px 30px; overflow-y: auto; min-height: 0; display: grid; gap: 14px; align-content: start; }
@media (max-width: 999px) { .p4 .col { border-right: 0; border-bottom: 1px solid var(--rule); } }
.p4 h3 { font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.p4 .lead { font-size: 13px; color: var(--ink); margin: 0 0 6px; }
.p4 .lead b { color: var(--cold); }
.p4 svg text { font: 11px var(--f-mono); fill: var(--muted); }
.p4 svg .ink { fill: var(--ink); } .p4 svg .big { font: 600 13px var(--f-body); fill: var(--ink); }
.wflow svg, .wpts svg { width: 100%; height: auto; display: block; }
.weta { position: relative; min-height: 320px; margin: 14px 18px 28px; display: flex; flex-direction: column; }
.weta .box { position: relative; flex: 1; min-height: 280px; }
.weta .box svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
footer { max-width: 1400px; margin: 0 auto; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
</style>

<div class="slide"><section class="board" aria-labelledby="p1h">
<header class="top">
  <h1 data-t="title"></h1>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
  </div>
</header>
  <span class="tag" data-t="page1"></span>
  <div class="p1">
    <aside class="rail" id="rail"></aside>
    <div class="main">
      <div>
        <h2 id="p1h" hidden data-t="page1"></h2>
        <div class="kpis" id="kpis"></div>
        <div class="warns" id="warns" style="margin-top:6px"></div>
      </div>
      <div class="chart" id="chart"></div>
      <div class="cmp">
        <div class="bars" id="bars"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>
</section></div>

<div class="slide"><section class="board" aria-labelledby="p2h">
  <span class="tag left" data-t="page2"></span>
  <div class="p2">
    <div class="stage" id="stage"></div>
    <aside class="readout" id="readout"></aside>
  </div>
</section></div>
<div class="slide"><section class="board" aria-labelledby="p3h">
  <span class="tag" data-t="page3"></span>
  <h2 id="p3h" hidden data-t="page3"></h2>
  <div class="p3">
    <aside class="ledger" id="ledger"></aside>
    <div class="lchart" id="lchart"></div>
  </div>
</section></div>
<div class="slide"><section class="board" aria-labelledby="p4h">
  <span class="tag" data-t="page4"></span>
  <h2 id="p4h" hidden data-t="page4"></h2>
  <div class="p4">
    <div class="col"><div class="wflow" id="wflow"></div><div class="wpts" id="wpts"></div></div>

<script src="params.js"></script>
<script src="model/air.js"></script>
<script src="model/compress.js"></script>
<script src="model/expand.js"></script>
<script src="model/recover.js"></script>
<script src="model/heat.js"></script>
<script src="model/system.js"></script>
