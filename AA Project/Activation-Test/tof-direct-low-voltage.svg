<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img"><title>VL53L1X · direct 3.3 V prototype wiring</title><desc>Requires the prepared low-voltage software-I²C firmware. Do not use ordinary Wire with this diagram.</desc><style>text{font-family:Arial,sans-serif;fill:#193442}.title{font-size:26px;font-weight:bold}.sub{font-size:17px}.pin{font-size:19px;font-family:monospace}.note{font-size:16px}.box{fill:#f4f8fa;stroke:#c3d2db;stroke-width:2}.wire{fill:none;stroke-width:3;stroke-linejoin:round}.small{font-size:14px}</style><rect width="1100" height="710" fill="white"/><text x="38" y="48" class="title">VL53L1X · direct 3.3 V prototype wiring</text><text x="38" y="80" class="sub">Requires the prepared low-voltage software-I²C firmware. Do not use ordinary Wire with this diagram.</text><rect class="box" x="40" y="115" width="300" height="280" rx="12"/><text x="62" y="151" font-size="21" font-weight="bold">Elegoo Uno R3 · USB</text><rect class="box" x="760" y="115" width="300" height="280" rx="12"/><text x="782" y="151" font-size="21" font-weight="bold">Walfront VL53L1X</text><text x="62" y="187" class="pin">3.3V</text><path class="wire" stroke="#d28722" d="M340,181 H550.0 V181 H760"/><text x="790" y="187" class="pin">VCC</text><text x="62" y="250" class="pin">GND</text><path class="wire" stroke="#465767" d="M340,244 H550.0 V244 H760"/><text x="790" y="250" class="pin">GND</text><text x="62" y="313" class="pin">A4</text><path class="wire" stroke="#0086aa" d="M340,307 H550.0 V307 H760"/><text x="790" y="313" class="pin">SDA</text><text x="62" y="376" class="pin">A5</text><path class="wire" stroke="#995bbe" d="M340,370 H550.0 V370 H760"/><text x="790" y="376" class="pin">SCL</text><text x="42" y="433" class="note">Leave INT / SHUT unconnected. No added diodes. Keep wires short.</text><text x="42" y="464" class="note">Firmware pulls SDA/SCL LOW or releases them. No 5 V HIGH drive or internal pull-ups.</text><rect class="box" x="40" y="493" width="1020" height="161" rx="12"/><text x="62" y="529" font-size="21" font-weight="bold">Keep the existing output loopback</text><text x="65" y="558" class="pin">D8 → direct jumper → D7 and A0. Both receiving pins stay INPUT.</text><text x="65" y="603" class="note">D13 onboard LED mirrors D8. This is an LED-only test; valve remains disconnected.</text><text x="42" y="694" class="note">Onboard low-voltage pull-ups must exist. Idle voltage and sensor identity are checked before ranging.</text></svg>