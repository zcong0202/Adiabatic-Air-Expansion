<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>HC-SR501 PIR wiring</title><desc>Use printed pin labels. Pin order changes between modules. USB powers the Uno.</desc><style>text{font-family:Arial,sans-serif;fill:#193442}.title{font-size:26px;font-weight:bold}.sub{font-size:17px}.pin{font-size:19px;font-family:monospace}.note{font-size:16px}.box{fill:#f4f8fa;stroke:#c3d2db;stroke-width:2}.wire{fill:none;stroke-width:3;stroke-linejoin:round}.small{font-size:14px}</style><rect width="1100" height="650" fill="white"/><text x="38" y="48" class="title">HC-SR501 PIR wiring</text><text x="38" y="80" class="sub">Use printed pin labels. Pin order changes between modules. USB powers the Uno.</text><rect class="box" x="45" y="115" width="290" height="270" rx="12"/><text x="67" y="151" font-size="21" font-weight="bold">Elegoo Uno R3 · USB</text><rect class="box" x="770" y="115" width="285" height="270" rx="12"/><text x="792" y="151" font-size="21" font-weight="bold">HC-SR501 module</text><text x="72" y="180" class="pin">5V</text><text x="798" y="180" class="pin">VCC</text><path class="wire" stroke="#cd4848" d="M335,174 H552.5 V174 H770"/><text x="72" y="230" class="pin">GND</text><text x="798" y="230" class="pin">GND</text><path class="wire" stroke="#465767" d="M335,224 H552.5 V224 H770"/><text x="72" y="280" class="pin">D2 · INPUT</text><text x="798" y="280" class="pin">OUT / DATA</text><path class="wire" stroke="#0086aa" d="M335,274 H552.5 V274 H770"/><text x="385" y="326" class="note">D2 → 100 kΩ → GND (external pull-down).</text><text x="385" y="355" class="note">H jumper; minimum hold time; allow 60 s warm-up.</text><rect class="box" x="45" y="415" width="1010" height="190" rx="12"/><text x="67" y="451" font-size="21" font-weight="bold">Shared LED output + signal reader</text><text x="70" y="504" class="pin">D8 OUTPUT</text><path class="wire" stroke="#0086aa" d="M224,498 H344.5 V498 H465"/><text x="288" y="484" class="note">1 kΩ series</text><rect x="278" y="490" width="83" height="16" fill="white" stroke="#0086aa" stroke-width="2"/><circle cx="465" cy="498" r="5" fill="#0086aa"/><text x="498" y="504" class="pin">D7 INPUT + A0 analog INPUT</text><path class="wire" stroke="#465767" d="M465,498 V539 H680"/><text x="490" y="529" class="note">10 kΩ pull-down</text><text x="700" y="545" class="pin">GND</text><text x="70" y="569" class="note">D13 = onboard L LED. Firmware mirrors D8. No external LED needed.</text><text x="70" y="594" class="note">Loopback HIGH ≈ 4.55 V (1 kΩ / 10 kΩ divider). LOW ≈ 0 V. Keep D7 and A0 as inputs.</text><text x="45" y="629" class="note">PIR HIGH is typically about 3.3 V. Do not enable the Uno input pull-up. Verify your module output.</text></svg>