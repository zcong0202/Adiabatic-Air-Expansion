<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img"><title>Future 12 V valve driver · concept only</title><desc>Confirm the valve label, pressure, temperature, duty and thread before a pneumatic test.</desc><style>text{font-family:Arial,sans-serif;fill:#193442}.title{font-size:26px;font-weight:bold}.sub{font-size:17px}.pin{font-size:19px;font-family:monospace}.note{font-size:16px}.box{fill:#f4f8fa;stroke:#c3d2db;stroke-width:2}.wire{fill:none;stroke-width:3;stroke-linejoin:round}.small{font-size:14px}</style><rect width="1100" height="700" fill="white"/><text x="38" y="48" class="title">Future 12 V valve driver · concept only</text><text x="38" y="80" class="sub">Confirm the valve label, pressure, temperature, duty and thread before a pneumatic test.</text><rect class="box" x="40" y="120" width="250" height="255" rx="12"/><text x="62" y="156" font-size="21" font-weight="bold">Uno · USB powered</text><rect class="box" x="755" y="120" width="295" height="255" rx="12"/><text x="777" y="156" font-size="21" font-weight="bold">Separate 12 V supply</text><text x="65" y="195" class="pin">D8 OUTPUT</text><path class="wire" stroke="#0086aa" d="M290,188 H387.0 V188 H484"/><text x="325" y="173" class="note">100 Ω gate resistor</text><rect x="336" y="180" width="70" height="16" fill="white" stroke="#0086aa" stroke-width="2"/><path class="wire" stroke="#465767" d="M484,238 V279 M484,317 V348 H550"/><rect x="476" y="279" width="16" height="38" fill="white" stroke="#465767" stroke-width="2"/><circle cx="545" cy="238" r="44" fill="#f4f8fa" stroke="#193442" stroke-width="2"/><path class="wire" stroke="#193442" d="M484,188 V238 H515 M550,194 V164 H600 V292 H675 V262 M550,282 V348 H980"/><text x="385" y="390" class="note">Logic-level N-MOSFET</text><text x="387" y="333" class="note">100 kΩ gate → GND</text><text x="775" y="185" class="pin">+12 V → fuse</text><path class="wire" stroke="#cd4848" d="M755,180 H715.0 V180 H675"/><rect x="640" y="190" width="70" height="72" rx="5" fill="#e5eef4" stroke="#193442" stroke-width="2"/><text x="645" y="232" class="small">COIL</text><path class="wire" stroke="#193442" d="M675,180 V190"/><path class="wire" stroke="#cd4848" d="M675,180 H730 V218 M730,246 V292 H675"/><path d="M714,246 L746,246 L730,220 Z" fill="white" stroke="#193442" stroke-width="2"/><path d="M710,218 H750" stroke="#193442" stroke-width="3"/><text x="772" y="237" class="note">Flyback diode across coil</text><text x="772" y="263" class="note">Cathode stripe to +12 V</text><text x="772" y="289" class="note">Anode to MOSFET drain</text><text x="773" y="341" class="pin">12 V negative = GND</text><path class="wire" stroke="#465767" d="M290,348 H395.0 V348 H500"/><text x="65" y="353" class="pin">GND</text><rect class="box" x="40" y="410" width="1010" height="240" rx="12"/><text x="62" y="446" font-size="21" font-weight="bold">Electrical and pneumatic constraints</text><text x="65" y="469" class="note">Listing: 12 V, 6.5 W → nominal coil current ≈ 0.54 A. Never power this coil from an Uno pin.</text><text x="65" y="501" class="note">Use a separate rated supply, fuse, MOSFET and suppression sized for the confirmed coil.</text><text x="65" y="533" class="note">D7 / A0 monitor D8 before the driver. Never connect 12 V or the coil drain to Uno inputs.</text><text x="65" y="565" class="note">Listing: 0–8 bar, G1/4 (BSPP), −5 to 60 °C. AA supply can exceed the pressure limit.</text><text x="65" y="597" class="note">Place the valve after verified pressure control. Protect against regulator overshoot.</text><text x="65" y="629" class="note">Command feedback confirms a logic voltage only. Coil current / airflow sensing is a later test.</text><text x="530" y="186" class="small">D</text><text x="530" y="303" class="small">S</text><text x="506" y="226" class="small">G</text></svg>