<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img"><title>VL53L1X ToF · conservative Uno wiring</title><desc>Walfront B08BYPYXQL: seller claims 3.3–5 V power. I²C voltage limits are not documented.</desc><style>text{font-family:Arial,sans-serif;fill:#193442}.title{font-size:26px;font-weight:bold}.sub{font-size:17px}.pin{font-size:19px;font-family:monospace}.note{font-size:16px}.box{fill:#f4f8fa;stroke:#c3d2db;stroke-width:2}.wire{fill:none;stroke-width:3;stroke-linejoin:round}.small{font-size:14px}</style><rect width="1100" height="800" fill="white"/><text x="38" y="48" class="title">VL53L1X ToF · conservative Uno wiring</text><text x="38" y="80" class="sub">Walfront B08BYPYXQL: seller claims 3.3–5 V power. I²C voltage limits are not documented.</text><rect class="box" x="40" y="115" width="245" height="350" rx="12"/><text x="62" y="151" font-size="21" font-weight="bold">Elegoo Uno R3 · USB</text><rect class="box" x="405" y="115" width="280" height="350" rx="12"/><text x="427" y="151" font-size="21" font-weight="bold">Bidirectional I²C shifter</text><rect class="box" x="805" y="115" width="260" height="350" rx="12"/><text x="827" y="151" font-size="21" font-weight="bold">VL53L1X module</text><text x="60" y="187" class="pin">5V</text><path class="wire" stroke="#cd4848" d="M285,181 H345.0 V181 H405"/><text x="425" y="187" class="pin">HV</text><text x="60" y="250" class="pin">3.3V</text><path class="wire" stroke="#d28722" d="M285,244 H345.0 V244 H405"/><text x="425" y="250" class="pin">LV</text><path class="wire" stroke="#d28722" d="M685,244 H745.0 V244 H805"/><text x="830" y="250" class="pin">VCC</text><text x="60" y="313" class="pin">GND</text><path class="wire" stroke="#465767" d="M285,307 H345.0 V307 H405"/><text x="425" y="313" class="pin">GND</text><path class="wire" stroke="#465767" d="M685,307 H745.0 V307 H805"/><text x="830" y="313" class="pin">GND</text><text x="60" y="376" class="pin">A4 / SDA</text><path class="wire" stroke="#0086aa" d="M285,370 H345.0 V370 H405"/><text x="425" y="376" class="pin">HV1 ↔ LV1</text><path class="wire" stroke="#0086aa" d="M685,370 H745.0 V370 H805"/><text x="830" y="376" class="pin">SDA</text><text x="60" y="439" class="pin">A5 / SCL</text><path class="wire" stroke="#995bbe" d="M285,433 H345.0 V433 H405"/><text x="425" y="439" class="pin">HV2 ↔ LV2</text><path class="wire" stroke="#995bbe" d="M685,433 H745.0 V433 H805"/><text x="830" y="439" class="pin">SCL</text><text x="405" y="496" class="note">Use a BSS138-style shifter for open-drain I²C.</text><text x="40" y="531" class="note">Leave module INT and SHUT disconnected. Match printed labels, not header position.</text><rect class="box" x="40" y="557" width="1025" height="187" rx="12"/><text x="62" y="593" font-size="21" font-weight="bold">Shared LED output + signal reader</text><text x="60" y="644" class="pin">D8 OUTPUT</text><path class="wire" stroke="#0086aa" d="M220,638 H342.5 V638 H465"/><text x="290" y="625" class="note">1 kΩ series</text><rect x="278" y="630" width="83" height="16" fill="white" stroke="#0086aa" stroke-width="2"/><circle cx="465" cy="638" r="5" fill="#0086aa"/><text x="490" y="644" class="pin">D7 INPUT + A0 analog INPUT</text><path class="wire" stroke="#465767" d="M465,638 V685 H680"/><text x="490" y="674" class="note">10 kΩ pull-down</text><text x="700" y="691" class="pin">GND</text><text x="60" y="725" class="note">D13 = onboard LED, mirrors D8. Loopback HIGH ≈ 4.55 V; LOW ≈ 0 V.</text><text x="40" y="785" class="note">Direct 5 V bus is an alternative only after confirming onboard regulator AND I²C level shifters.</text></svg>