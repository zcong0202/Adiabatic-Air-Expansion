<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" role="img" aria-label="Valve wiring using the supplied BoM"><style>text{font-family:Arial,sans-serif;fill:#183444;font-size:16px}.title{font-size:25px;font-weight:700}.small{font-size:14px}.label{font-weight:700}.box{fill:white;stroke:#bed0d5;stroke-width:2}.wire{fill:none;stroke-width:4;stroke-linejoin:round}.dot{fill:#183444}</style><rect width="1060" height="680" fill="#f6f9f8"/><text x="32" y="44" class="title">Valve wiring using the supplied BoM</text><text x="32" y="72" class="small">Label-based schematic. Relay COM / NO positions and input polarity vary by module.</text><rect x="35" y="115" width="210" height="245" rx="14" class="box"/><text x="59" y="151" class="label">Uno R3</text><text x="59" y="178" class="small">USB logic power</text><text x="180" y="220">5V</text><text x="170" y="262">GND</text><text x="180" y="304">D8</text>
<rect x="400" y="115" width="265" height="245" rx="14" class="box"/><text x="425" y="151" class="label">RobotGCC 5 V relay</text><text x="425" y="178" class="small">Select matching trigger mode</text><text x="418" y="220">VCC</text><text x="418" y="262">GND</text><text x="418" y="304">IN</text><text x="600" y="220">COM</text><text x="615" y="262">NO</text><text x="615" y="304">NC</text><path d="M245 214 H400" class="wire" stroke="#c25836"/><path d="M245 256 H400" class="wire" stroke="#354653"/><path d="M245 298 H400" class="wire" stroke="#087b60"/><text x="266" y="340" class="small">D8 → D7 + A0 retained</text><text x="712" y="307" class="small">NC unused</text>
<rect x="35" y="408" width="210" height="136" rx="14" class="box"/><text x="57" y="445" class="label">UPS DC output</text><text x="57" y="474">Set to 12 V DC</text><text x="176" y="509">+</text><text x="174" y="534">−</text>
<path d="M245 503 H300 V390 H1030 V95 H700 V214 H665" class="wire" stroke="#c25836"/><rect x="336" y="374" width="88" height="31" rx="5" class="box"/><text x="351" y="396" class="small">1 A fuse</text><circle cx="470" cy="390" r="5" class="dot"/><path d="M470 390 L499 374" stroke="#183444" stroke-width="3"/><circle cx="514" cy="390" r="5" class="dot"/><text x="447" y="434" class="small">Isolation</text><text x="450" y="455" class="small">switch</text>
<rect x="838" y="408" width="180" height="136" rx="14" class="box"/><text x="861" y="443" class="label">12 V NC valve</text><text x="858" y="474" class="small">USS-PSV00041</text><text x="851" y="509">+</text><text x="852" y="534">−</text><path d="M665 256 H790 V503 H838" fill="none" stroke="#f6f9f8" stroke-width="12"/><path d="M665 256 H790 V503 H838" class="wire" stroke="#c25836"/><text x="814" y="376" class="small">Crossing: no connection</text><path d="M245 528 H838" class="wire" stroke="#354653"/>
<path d="M748 444 V430 H790 M748 470 V528" fill="none" stroke="#183444" stroke-width="3"/><path d="M735 470 L748 447 L761 470 Z" fill="#183444"/><path d="M733 443 H763" stroke="#183444" stroke-width="5"/><circle cx="790" cy="430" r="5" fill="#c25836"/><circle cx="790" cy="503" r="5" fill="#c25836"/><circle cx="748" cy="528" r="5" class="dot"/><text x="589" y="463" class="small">1N4007</text><text x="589" y="485" class="small">Stripe → positive</text>
<text x="35" y="590" class="label">12 V branch OFF during wiring, upload and polarity changes.</text><text x="35" y="620" class="small">Mount diode close to coil. Fuse close to UPS. Coil current stays off Uno and breadboard.</text><text x="35" y="649" class="small">Relay contacts isolate the 12 V circuit; no UPS 12 V ground connection to Uno is needed here.</text></svg>