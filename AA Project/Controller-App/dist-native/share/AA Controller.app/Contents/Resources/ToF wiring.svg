<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 570" role="img" aria-label="ToF + onboard LED + signal reader"><style>text{font-family:Arial,sans-serif;fill:#183444;font-size:16px}.title{font-size:25px;font-weight:700}.small{font-size:14px}.label{font-weight:700}.box{fill:white;stroke:#bed0d5;stroke-width:2}.wire{fill:none;stroke-width:4;stroke-linejoin:round}.dot{fill:#183444}</style><rect width="1060" height="570" fill="#f6f9f8"/><text x="32" y="44" class="title">ToF + onboard LED + signal reader</text><text x="32" y="72" class="small">Use the included firmware only. Short leads. A4/A5 never drive HIGH or enable 5 V pull-ups.</text><rect x="40" y="110" width="260" height="300" rx="16" class="box"/><text x="68" y="147" class="label">Elegoo Uno R3</text><text x="68" y="175" class="small">Powered by USB (5 V)</text><text x="230" y="217">3.3V</text><text x="230" y="257">GND</text><text x="248" y="297">A4</text><text x="248" y="337">A5</text><text x="68" y="380" class="small">D13: built-in L LED</text>
<rect x="710" y="110" width="305" height="300" rx="16" class="box"/><text x="737" y="147" class="label">Walfront VL53L1X</text><text x="737" y="175" class="small">Match the printed pin labels</text><text x="730" y="217">VCC</text><text x="730" y="257">GND</text><text x="730" y="297">SDA</text><text x="730" y="337">SCL</text><text x="737" y="381" class="small">INT / SHUT: leave unused</text>
<path d="M300 211 H710" class="wire" stroke="#c25836"/><path d="M300 251 H710" class="wire" stroke="#354653"/><path d="M300 291 H710" class="wire" stroke="#278fa8"/><path d="M300 331 H710" class="wire" stroke="#9a70b2"/><text x="356" y="201" class="small">3.3 V supply</text><text x="356" y="281" class="small">SDA · software I²C</text><text x="356" y="361" class="small">SCL · software I²C</text>
<rect x="40" y="435" width="975" height="103" rx="12" class="box"/><text x="65" y="467" class="label">Keep the signal reader loopback</text><text x="65" y="498">D8 output</text><path d="M177 492 H440 M315 492 V517 H440" class="wire" stroke="#087b60"/><circle cx="315" cy="492" r="5" fill="#087b60"/><text x="460" y="498">D7 digital input</text><text x="460" y="523">A0 voltage input</text><text x="712" y="491" class="small">D8 also goes to relay IN.</text><text x="712" y="518" class="small">PIR disconnected. No loose resistor.</text></svg>